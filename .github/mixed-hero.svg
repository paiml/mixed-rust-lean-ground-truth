<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Main background gradient: Rust orange to Lean deep purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c45a1a;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#8b3a62;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#5b2d8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle overlay gradient for depth -->
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.06" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </linearGradient>

    <!-- Glow for decorative elements -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft shadow for text -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="6" ry="6" />
  <rect width="800" height="200" fill="url(#overlayGrad)" rx="6" ry="6" />

  <!-- Subtle grid pattern suggesting code/proof structure -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
  </g>

  <!-- Rust motif: Gear/cog (left side) -->
  <g transform="translate(85, 100)" opacity="0.12" fill="none" stroke="#ff9e64" stroke-width="1.5">
    <path d="M0,-38 L4,-36 L5,-30 L9,-30 L10,-36 L14,-38 L16,-33 L20,-34 L18,-28 L22,-26 L25,-30 L28,-26 L24,-22 L27,-18 L31,-19 L32,-14 L28,-12 L29,-8 L34,-7 L33,-2 L28,-2 L28,2 L33,2 L34,7 L29,8 L28,12 L32,14 L31,19 L27,18 L24,22 L28,26 L25,30 L22,26 L18,28 L20,34 L16,33 L14,38 L10,36 L9,30 L5,30 L4,36 L0,38 L-4,36 L-5,30 L-9,30 L-10,36 L-14,38 L-16,33 L-20,34 L-18,28 L-22,26 L-25,30 L-28,26 L-24,22 L-27,18 L-31,19 L-32,14 L-28,12 L-29,8 L-34,7 L-33,2 L-28,2 L-28,-2 L-33,-2 L-34,-7 L-29,-8 L-28,-12 L-32,-14 L-31,-19 L-27,-18 L-24,-22 L-28,-26 L-25,-30 L-22,-26 L-18,-28 L-20,-34 L-16,-33 L-14,-38 L-10,-36 L-9,-30 L-5,-30 L-4,-36 Z" />
    <circle cx="0" cy="0" r="16" />
    <circle cx="0" cy="0" r="4" fill="#ff9e64" />
  </g>

  <!-- Second smaller gear (Rust motif, overlapping) -->
  <g transform="translate(48, 65) rotate(15)" opacity="0.08" fill="none" stroke="#ffb088" stroke-width="1">
    <path d="M0,-22 L3,-20 L3,-17 L6,-17 L6,-20 L9,-22 L10,-19 L13,-19 L11,-16 L14,-14 L16,-17 L18,-14 L15,-12 L17,-9 L20,-10 L20,-7 L17,-6 L18,-3 L21,-2 L20,1 L17,1 L17,4 L20,5 L20,8 L17,7 L17,10 L20,11 L18,14 L16,12 L14,14 L16,17 L14,18 L11,16 L10,19 L13,20 L9,22 L6,20 L6,17 L3,17 L3,20 L0,22 L-3,20 L-3,17 L-6,17 L-6,20 L-9,22 L-10,19 L-13,20 L-11,16 L-14,14 L-16,17 L-18,14 L-15,12 L-17,9 L-20,10 L-20,7 L-17,6 L-18,3 L-21,2 L-20,-1 L-17,-1 L-17,-4 L-20,-5 L-20,-8 L-17,-7 L-17,-10 L-20,-11 L-18,-14 L-16,-12 L-14,-14 L-16,-17 L-14,-18 L-11,-16 L-10,-19 L-13,-20 L-9,-22 L-6,-20 L-6,-17 L-3,-17 L-3,-20 Z" />
    <circle cx="0" cy="0" r="9" />
  </g>

  <!-- Lean motif: Proof/theorem symbols (right side) -->
  <!-- Turnstile symbol (logical entailment) -->
  <g transform="translate(700, 85)" opacity="0.12" stroke="#c4a0ff" stroke-width="1.8" fill="none">
    <line x1="0" y1="-20" x2="0" y2="20" />
    <line x1="0" y1="0" x2="25" y2="0" />
  </g>

  <!-- Lambda symbol -->
  <text x="730" y="155" font-family="serif" font-size="48" fill="#c4a0ff" opacity="0.1" font-style="italic">&#955;</text>

  <!-- Forall symbol -->
  <text x="660" y="60" font-family="serif" font-size="32" fill="#d4b0ff" opacity="0.08" font-style="italic">&#8704;</text>

  <!-- QED square -->
  <rect x="740" y="40" width="12" height="12" fill="#c4a0ff" opacity="0.07" />

  <!-- Arrow (implication) -->
  <g transform="translate(680, 160)" opacity="0.08" stroke="#d4b0ff" stroke-width="1.5" fill="none">
    <line x1="0" y1="0" x2="30" y2="0" />
    <polyline points="24,-5 30,0 24,5" />
  </g>

  <!-- Connecting bridge: Dots flowing left to right (Rust to Lean transition) -->
  <g opacity="0.15">
    <circle cx="180" cy="100" r="1.5" fill="#ff9e64" />
    <circle cx="210" cy="95" r="1.2" fill="#ff8e54" />
    <circle cx="240" cy="102" r="1.8" fill="#e07a5a" />
    <circle cx="270" cy="98" r="1" fill="#c87070" />
    <circle cx="300" cy="105" r="1.5" fill="#b06880" />
    <circle cx="330" cy="97" r="1.3" fill="#9860a0" />
    <circle cx="560" cy="103" r="1.3" fill="#9060b0" />
    <circle cx="590" cy="96" r="1.5" fill="#a070c0" />
    <circle cx="620" cy="101" r="1" fill="#b080d0" />
    <circle cx="650" cy="98" r="1.8" fill="#c090e0" />
  </g>

  <!-- Divider line accent -->
  <line x1="200" y1="118" x2="600" y2="118" stroke="url(#bgGrad)" stroke-width="0.5" opacity="0.3" />
  <line x1="240" y1="119" x2="560" y2="119" stroke="#ffffff" stroke-width="0.3" opacity="0.15" />

  <!-- Main title -->
  <text x="400" y="88" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" filter="url(#textShadow)" letter-spacing="0.5">
    mixed-rust-lean-ground-truth
  </text>

  <!-- Subtitle -->
  <text x="400" y="140" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e0d0f0" opacity="0.85" letter-spacing="2">
    Cross-Language Quality Analysis Corpus
  </text>

  <!-- Small accent: Rust + Lean badges -->
  <g transform="translate(310, 158)">
    <rect x="0" y="0" width="52" height="18" rx="9" ry="9" fill="#c45a1a" opacity="0.5" />
    <text x="26" y="13" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.9" font-weight="600">Rust</text>
  </g>
  <g transform="translate(370, 158)">
    <circle cx="4" cy="9" r="2" fill="#ffffff" opacity="0.3" />
  </g>
  <g transform="translate(382, 158)">
    <rect x="0" y="0" width="55" height="18" rx="9" ry="9" fill="#5b2d8e" opacity="0.5" />
    <text x="27.5" y="13" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.9" font-weight="600">Lean 4</text>
  </g>
  <g transform="translate(445, 158)">
    <circle cx="4" cy="9" r="2" fill="#ffffff" opacity="0.3" />
  </g>
  <g transform="translate(457, 158)">
    <rect x="0" y="0" width="52" height="18" rx="9" ry="9" fill="#ffffff" opacity="0.1" />
    <text x="26" y="13" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.7" font-weight="600">PMAT</text>
  </g>

  <!-- Corner accents -->
  <line x1="15" y1="15" x2="40" y2="15" stroke="#ff9e64" stroke-width="1.5" opacity="0.3" />
  <line x1="15" y1="15" x2="15" y2="40" stroke="#ff9e64" stroke-width="1.5" opacity="0.3" />
  <line x1="785" y1="185" x2="760" y2="185" stroke="#c4a0ff" stroke-width="1.5" opacity="0.3" />
  <line x1="785" y1="185" x2="785" y2="160" stroke="#c4a0ff" stroke-width="1.5" opacity="0.3" />
</svg>
